<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brilliance Tracker</title>

<style>
body{
    background:#0d1b2a;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    background:#1b263b;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:700px;
    text-align:center;
}

h1{
    margin-top:0;
}

.estado{
    font-size:36px;
    font-weight:bold;
    margin:20px 0;
}

.amarrado{
    color:#4CAF50;
}

.navegando{
    color:#FF9800;
}

.info{
    font-size:22px;
    margin:12px 0;
}
</style>
</head>
<body>

<div class="card">

<h1>🚢 Brilliance of the Seas</h1>

<div id="estado" class="estado"></div>
<div id="info1" class="info"></div>
<div id="info2" class="info"></div>
<div id="info3" class="info"></div>

</div>

<script>

const puertoActual = {
    puerto: "Mykonos",
    pais: "Grecia",
    zona: "Europe/Athens",
    salida: "17:00",
    siguientePuerto: "Kusadasi",
    siguientePais: "Turquía"
};

function actualizar(){

    const horaLocal = new Intl.DateTimeFormat(
        'en-GB',
        {
            timeZone: puertoActual.zona,
            hour:'2-digit',
            minute:'2-digit',
            second:'2-digit',
            hour12:false
        }
    ).format(new Date());

    const horaComparacion = horaLocal.substring(0,5);

    if(horaComparacion < puertoActual.salida){

        document.getElementById("estado").innerHTML =
        "🟢 AMARRADO";

        document.getElementById("estado").className =
        "estado amarrado";

        document.getElementById("info1").innerHTML =
        "⚓ Puerto: <b>" + puertoActual.puerto + "</b>";

        document.getElementById("info2").innerHTML =
        "🌍 País: <b>" + puertoActual.pais + "</b>";

        document.getElementById("info3").innerHTML =
        "🕒 Hora local: <b>" + horaLocal + "</b>";

    } else {

        document.getElementById("estado").innerHTML =
        "🟠 NAVEGANDO";

        document.getElementById("estado").className =
        "estado navegando";

        document.getElementById("info1").innerHTML =
        "🚢 Navegando desde <b>" + puertoActual.puerto + "</b>";

        document.getElementById("info2").innerHTML =
        "➡️ Hacia <b>" + puertoActual.siguientePuerto + "</b>";

        document.getElementById("info3").innerHTML =
        "🌍 Destino: <b>" + puertoActual.siguientePais + "</b>";
    }
}

actualizar();
setInterval(actualizar,1000);

</script>

</body>
</html>
