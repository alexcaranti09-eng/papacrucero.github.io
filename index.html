<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado del Brilliance</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0d1b2a;
    color:white;
    text-align:center;
    padding:30px;
}
.card{
    max-width:700px;
    margin:auto;
    background:#1b263b;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.4);
}
.estado{
    font-size:2rem;
    font-weight:bold;
    margin:15px 0;
}
.amarrado{color:#4caf50;}
.navegando{color:#ff9800;}
.info{
    font-size:1.2rem;
    margin:10px 0;
}
</style>
</head>
<body>

<div class="card">
    <h1>🚢 Brilliance of the Seas</h1>

    <div id="estado" class="estado"></div>
    <div id="ubicacion" class="info"></div>
    <div id="ruta" class="info"></div>
    <div id="hora" class="info"></div>
</div>

<script>

const itinerario = [
{fecha:"2026-06-01", puerto:"Piraeus", pais:"Grecia", llegada:"05:00", salida:"17:00"},
{fecha:"2026-06-02", puerto:"Mykonos", pais:"Grecia", llegada:"07:00", salida:"17:00"},
{fecha:"2026-06-03", puerto:"Istanbul", pais:"Turquía", llegada:"13:00", salida:null},
{fecha:"2026-06-04", puerto:"Istanbul", pais:"Turquía", llegada:null, salida:"21:00"},
{fecha:"2026-06-05", puerto:"Cruising", pais:"Mar Mediterráneo"},
{fecha:"2026-06-06", puerto:"Kusadasi", pais:"Turquía", llegada:"08:00", salida:"18:00"},
{fecha:"2026-06-07", puerto:"Santorini", pais:"Grecia", llegada:"07:00", salida:"20:00"}
];

const ahora = new Date();

function hoyStr(){
    return ahora.toISOString().split("T")[0];
}

const hoy = itinerario.find(i => i.fecha === hoyStr());

const estadoDiv = document.getElementById("estado");
const ubicacionDiv = document.getElementById("ubicacion");
const rutaDiv = document.getElementById("ruta");
const horaDiv = document.getElementById("hora");

if(hoy){

    if(hoy.puerto === "Cruising"){

        estadoDiv.textContent = "🟠 NAVEGANDO";
        estadoDiv.className = "estado navegando";

        const ayerIndex = itinerario.findIndex(i=>i.fecha===hoy.fecha)-1;
        const mananaIndex = itinerario.findIndex(i=>i.fecha===hoy.fecha)+1;

        const origen = itinerario[ayerIndex];
        const destino = itinerario[mananaIndex];

        rutaDiv.innerHTML =
            `Desde <b>${origen.puerto}</b> (${origen.pais})<br>
             Hacia <b>${destino.puerto}</b> (${destino.pais})`;

        ubicacionDiv.textContent = "En navegación";
        horaDiv.textContent = "";
    }

    else{

        const [h,m] = (hoy.salida || "23:59").split(":");
        const salidaHoy = new Date();
        salidaHoy.setHours(h,m);

        if(ahora < salidaHoy){

            estadoDiv.textContent = "🟢 AMARRADO";
            estadoDiv.className = "estado amarrado";

            ubicacionDiv.innerHTML =
            `<b>${hoy.puerto}</b>, ${hoy.pais}`;

            const horaLocal = new Intl.DateTimeFormat('es-ES',{
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }).format(new Date());

            horaDiv.innerHTML =
            `Hora local: <b>${horaLocal}</b>`;

            rutaDiv.innerHTML =
            `Salida prevista: <b>${hoy.salida}</b>`;
        }

        else{

            const indice = itinerario.findIndex(i=>i.fecha===hoy.fecha);
            const destino = itinerario[indice+1];

            estadoDiv.textContent = "🟠 NAVEGANDO";
            estadoDiv.className = "estado navegando";

            rutaDiv.innerHTML =
            `Desde <b>${hoy.puerto}</b> (${hoy.pais})<br>
             Hacia <b>${destino.puerto}</b> (${destino.pais})`;

            ubicacionDiv.textContent = "En navegación";
        }
    }
}
else{
    estadoDiv.textContent = "No hay datos para esta fecha";
}

</script>

</body>
</html>
