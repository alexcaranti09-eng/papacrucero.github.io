<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Dónde está Juan?</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:25px;
    max-width:500px;
    margin:auto;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
    margin-top:0;
}

.estado{
    font-size:28px;
    margin:15px 0;
}

.info{
    font-size:20px;
    margin:10px 0;
}

.hora{
    font-size:24px;
    font-weight:bold;
    color:#38bdf8;
}
</style>
</head>
<body>

<div class="card">
    <h1>🚢 ¿Dónde está Juan?</h1>

    <div class="estado" id="estado"></div>
    <div class="info" id="ubicacion"></div>
    <div class="hora" id="hora"></div>
    <div class="info" id="detalle"></div>
</div>

<script>

{fecha:"2026-05-31", lugar:"Mykonos, Grecia", zona:"Europe/Athens"},

{fecha:"2026-07-13", lugar:"Piraeus (Atenas), Grecia", zona:"Europe/Athens"}
];

const hoy = new Date().toISOString().split("T")[0];

const actual = itinerario.find(x => x.fecha === hoy);

if(!actual){
    document.getElementById("estado").innerHTML="📅 Fuera del itinerario";
}
else if(actual.lugar==="NAVEGANDO"){

    const indice = itinerario.findIndex(x => x.fecha===hoy);

    let origen = "";
    let destino = "";

    for(let i=indice-1;i>=0;i--){
        if(itinerario[i].lugar!=="NAVEGANDO"){
            origen=itinerario[i];
            break;
        }
    }

    for(let i=indice+1;i<itinerario.length;i++){
        if(itinerario[i].lugar!=="NAVEGANDO"){
            destino=itinerario[i];
            break;
        }
    }

    document.getElementById("estado").innerHTML="🌊 Navegando";
    document.getElementById("ubicacion").innerHTML=
        `De: ${origen.lugar}<br>Hacia: ${destino.lugar}`;

    const hora = new Date().toLocaleTimeString("es-AR",{
        timeZone: destino.zona,
        hour:'2-digit',
        minute:'2-digit'
    });

    document.getElementById("hora").innerHTML="🕒 "+hora;
    document.getElementById("detalle").innerHTML="🚢 En tránsito";
}
else{

    document.getElementById("estado").innerHTML="⚓ Amarrado";
    document.getElementById("ubicacion").innerHTML="📍 "+actual.lugar;

    const hora = new Date().toLocaleTimeString("es-AR",{
        timeZone: actual.zona,
        hour:'2-digit',
        minute:'2-digit'
    });

    document.getElementById("hora").innerHTML="🕒 "+hora;
    document.getElementById("detalle").innerHTML="Puerto actual";
}

</script>

</body>
</html>
