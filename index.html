<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brilliance Tracker</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0d1b2a;
    color:white;
    text-align:center;
    padding:20px;
}

.card{
    max-width:700px;
    margin:auto;
    background:#1b263b;
    padding:25px;
    border-radius:15px;
}

.estado{
    font-size:32px;
    font-weight:bold;
    margin:20px 0;
}

.amarrado{
    color:#4CAF50;
}

.navegando{
    color:#FF9800;
}

.info{
    font-size:22px;
    margin:15px 0;
}
</style>
</head>
<body>

<div class="card">

<h1>🚢 Brilliance of the Seas</h1>

<div id="estado" class="estado"></div>

<div id="puerto" class="info"></div>
<div id="hora" class="info"></div>
<div id="destino" class="info"></div>

</div>

<script>

const escalas = [
{
puerto:"Mykonos",
pais:"Grecia",
zona:"Europe/Athens",
salida:"17:00",
destino:"Piraeus"
}
];

const escala = escalas[0];

function actualizar(){

const horaPuerto = new Intl.DateTimeFormat(
'es-AR',
{
timeZone: escala.zona,
hour:'2-digit',
minute:'2-digit',
second:'2-digit',
hour12:false
}
).format(new Date());

document.getElementById("puerto").innerHTML =
"⚓ Puerto: <b>" + escala.puerto + "</b> - " + escala.pais;

document.getElementById("hora").innerHTML =
"🕒 Hora local: <b>" + horaPuerto + "</b>";

document.getElementById("destino").innerHTML =
"➡️ Próximo destino: <b>" + escala.destino + "</b>";

const horaActual = horaPuerto.substring(0,5);

if(horaActual < escala.salida){

document.getElementById("estado").innerHTML =
"🟢 AMARRADO";

document.getElementById("estado").className =
"estado amarrado";

}else{

document.getElementById("estado").innerHTML =
"🟠 NAVEGANDO";

document.getElementById("estado").className =
"estado navegando";

}

}

actualizar();
setInterval(actualizar,1000);

</script>

</body>
</html>
