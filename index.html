<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donde esta papa </title>

<style>
body{
background:#0d1b2a;
color:white;
font-family:Arial,sans-serif;
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
background:#1b263b;
padding:30px;
border-radius:20px;
width:90%;
max-width:700px;
text-align:center;
}

.estado{
font-size:34px;
font-weight:bold;
margin:20px 0;
}

.amarrado{color:#4CAF50;}
.navegando{color:#FF9800;}

.info{
font-size:22px;
margin:12px 0;
}
</style>
</head>
<body>

<div class="card">

<h1>🚢 Donde esa el abuelo</h1>

<div id="estado" class="estado"></div>
<div id="info1" class="info"></div>
<div id="info2" class="info"></div>
<div id="info3" class="info"></div>
<div id="info4" class="info"></div>

</div>

<script>

const itinerario = [

{fecha:"2026-05-31", puerto:"Mykonos", pais:"Grecia", salida:"17:00", zona:"Europe/Athens"},
{fecha:"2026-06-01", puerto:"Piraeus", pais:"Grecia", salida:"17:00", zona:"Europe/Athens"},
{fecha:"2026-06-02", puerto:"Mykonos", pais:"Grecia", salida:"17:00", zona:"Europe/Athens"},
{fecha:"2026-06-03", puerto:"Istanbul", pais:"Turquía", salida:"23:59", zona:"Europe/Istanbul"},
{fecha:"2026-06-04", puerto:"Istanbul", pais:"Turquía", salida:"21:00", zona:"Europe/Istanbul"},
{fecha:"2026-06-05", puerto:"CRUISING"},
{fecha:"2026-06-06", puerto:"Kusadasi", pais:"Turquía", salida:"18:00", zona:"Europe/Istanbul"},
{fecha:"2026-06-07", puerto:"Santorini", pais:"Grecia", salida:"20:00", zona:"Europe/Athens"},
{fecha:"2026-06-08", puerto:"Piraeus", pais:"Grecia", salida:"17:00", zona:"Europe/Athens"},
{fecha:"2026-06-09", puerto:"Mykonos", pais:"Grecia", salida:"17:00", zona:"Europe/Athens"},
{fecha:"2026-06-10", puerto:"Kusadasi", pais:"Turquía", salida:"18:00", zona:"Europe/Istanbul"},
{fecha:"2026-06-11", puerto:"Santorini", pais:"Grecia", salida:"22:00", zona:"Europe/Athens"},
{fecha:"2026-06-12", puerto:"Chania", pais:"Grecia", salida:"17:00", zona:"Europe/Athens"},
{fecha:"2026-06-13", puerto:"Katakolon", pais:"Grecia", salida:"17:00", zona:"Europe/Athens"},
{fecha:"2026-06-14", puerto:"CRUISING"},
{fecha:"2026-06-15", puerto:"Civitavecchia", pais:"Italia", salida:"17:00", zona:"Europe/Rome"},
{fecha:"2026-06-16", puerto:"Livorno", pais:"Italia", salida:"20:00", zona:"Europe/Rome"},
{fecha:"2026-06-17", puerto:"Santa Margherita", pais:"Italia", salida:"19:00", zona:"Europe/Rome"},
{fecha:"2026-06-18", puerto:"Villefranche", pais:"Francia", salida:"19:00", zona:"Europe/Paris"},
{fecha:"2026-06-19", puerto:"Marseille", pais:"Francia", salida:"18:00", zona:"Europe/Paris"},
{fecha:"2026-06-20", puerto:"CRUISING"},
{fecha:"2026-06-21", puerto:"Ibiza", pais:"España", salida:"19:00", zona:"Europe/Madrid"},
{fecha:"2026-06-22", puerto:"Barcelona", pais:"España", salida:"17:00", zona:"Europe/Madrid"},
{fecha:"2026-06-23", puerto:"Toulon", pais:"Francia", salida:"17:00", zona:"Europe/Paris"},
{fecha:"2026-06-24", puerto:"Ajaccio", pais:"Francia", salida:"17:00", zona:"Europe/Paris"},
{fecha:"2026-06-25", puerto:"Civitavecchia", pais:"Italia", salida:"19:00", zona:"Europe/Rome"},
{fecha:"2026-06-26", puerto:"Naples", pais:"Italia", salida:"19:00", zona:"Europe/Rome"},
{fecha:"2026-06-27", puerto:"Messina", pais:"Italia", salida:"17:00", zona:"Europe/Rome"},
{fecha:"2026-06-28", puerto:"CRUISING"},
{fecha:"2026-06-29", puerto:"Ravenna", pais:"Italia", salida:"17:00", zona:"Europe/Rome"},
{fecha:"2026-06-30", puerto:"Koper", pais:"Eslovenia", salida:"17:00", zona:"Europe/Ljubljana"}

];

function actualizar(){

const hoy = new Date().toISOString().split("T")[0];

const indice = itinerario.findIndex(e => e.fecha === hoy);

if(indice === -1){

document.getElementById("estado").innerHTML = "📅 Fuera del itinerario";
document.getElementById("info1").innerHTML = "";
document.getElementById("info2").innerHTML = "";
document.getElementById("info3").innerHTML = "";
document.getElementById("info4").innerHTML = "";
return;
}

const escala = itinerario[indice];

if(escala.puerto === "CRUISING"){

const origen = itinerario[indice-1];
const destino = itinerario[indice+1];

document.getElementById("estado").innerHTML = "🟠 NAVEGANDO";
document.getElementById("estado").className = "estado navegando";

document.getElementById("info1").innerHTML =
"🚢 Desde <b>"+origen.puerto+"</b>";

document.getElementById("info2").innerHTML =
"➡️ Hacia <b>"+destino.puerto+"</b>";

document.getElementById("info3").innerHTML =
"🌍 Destino: "+destino.pais;

document.getElementById("info4").innerHTML = "";

return;
}

const horaPuerto = new Intl.DateTimeFormat(
'en-GB',
{
timeZone: escala.zona,
hour:'2-digit',
minute:'2-digit',
second:'2-digit',
hour12:false
}
).format(new Date());

const hhmm = horaPuerto.substring(0,5);

const destino = itinerario[indice+1];

if(hhmm < escala.salida){

document.getElementById("estado").innerHTML = "🟢 NAVEGANDO";
document.getElementById("estado").className = "estado amarrado";

document.getElementById("info1").innerHTML =
"⚓ Puerto: <b>"+escala.puerto+"</b>";

document.getElementById("info2").innerHTML =
"🌍 País: "+escala.pais;

document.getElementById("info3").innerHTML =
"🕒 Hora local: "+horaPuerto;

document.getElementById("info4").innerHTML =
destino ? "➡️ Próximo puerto: <b>"+destino.puerto+"</b>" : "";

}else{

document.getElementById("estado").innerHTML = "🟠 AMARRADO";
document.getElementById("estado").className = "estado navegando";

document.getElementById("info1").innerHTML =
"🚢 Desde <b>"+escala.puerto+"</b>";

document.getElementById("info2").innerHTML =
destino ? "➡️ Hacia <b>"+destino.puerto+"</b>" : "";

document.getElementById("info3").innerHTML =
destino ? "🌍 Destino: "+destino.pais : "";

document.getElementById("info4").innerHTML =
"🕒 Hora local: "+horaPuerto;

}

}

actualizar();
setInterval(actualizar,1000);

</script>

</body>
</html>
